# Publishes docs-site to GitHub Pages, in English and German.
#
# Path-filtered: the documentation rebuilds when the documentation changes, not
# on every commit to the transport. The package manifest is in the filter because
# the footer stamps the version it documents.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'packages/webrtc-qr/package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer one win: a queued docs build is
# always superseded by the commit behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamp reads the commit, and a shallow clone still has HEAD.
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      # docs-site is deliberately outside the pnpm workspace - see its .npmrc,
      # which is what makes a plain install here resolve its own lockfile.
      - run: pnpm install --frozen-lockfile
        working-directory: docs-site

      - run: pnpm run build
        working-directory: docs-site
        env:
          DOCS_URL: https://nikrause.github.io
          DOCS_BASE_URL: /libp2p-webrtc-qr/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
