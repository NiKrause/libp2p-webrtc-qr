name: Build & Deploy to Aleph IPFS

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      link_domain:
        description: >-
          Point the custom domain at this build. Off by default so a branch
          preview cannot take over the production domain - the CID this run
          publishes is enough to test it.
        type: boolean
        required: false
        default: false
      domain:
        description: >-
          Aleph custom domain to link (e.g. webrtc-qr.le-space.de).
          Leave empty to use the default below.
        required: false
        default: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 25
    env:
      # Firefox refuses to start when $HOME is not owned by the current user,
      # which is the case for the default HOME inside this container. Playwright
      # names this fix in its own launch error.
      HOME: /root
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run signaling codec unit tests
        id: qr-unit
        run: pnpm --filter @le-space/libp2p-webrtc-qr test

      # The Playwright container ships Chromium, Firefox and WebKit, so both
      # suites run on all three without an install step.
      - name: Run signed QR signaling E2E
        id: qr-e2e
        run: pnpm --filter @le-space/libp2p-webrtc-qr-demo test

      - name: Run Helia file transfer E2E
        id: helia-e2e
        run: pnpm --filter @le-space/libp2p-webrtc-qr-helia-example test

      - name: Summarize E2E
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.qr-e2e.outcome }}
          UNIT_OUTCOME: ${{ steps.qr-unit.outcome }}
          HELIA_OUTCOME: ${{ steps.helia-e2e.outcome }}
        run: |
          {
            echo '## Signed QR WebRTC signaling tests'
            echo
            if [ "${E2E_OUTCOME}" = 'success' ] && [ "${UNIT_OUTCOME}" = 'success' ] && [ "${HELIA_OUTCOME}" = 'success' ]; then
              echo '**Result:** ✅ passed'
            else
              echo "**Result:** ❌ unit ${UNIT_OUTCOME}, e2e ${E2E_OUTCOME}, helia ${HELIA_OUTCOME}"
            fi
            echo
            echo '| Verified behavior | Result |'
            echo '| --- | --- |'
            echo "| Signature codec: round trip, tampering, replay and field smuggling | ${UNIT_OUTCOME} |"
            echo "| Two browser libp2p peers connect over a QR-signalled WebRTC session, on Chromium, Firefox and WebKit | ${E2E_OUTCOME} |"
            echo "| A rendered QR image decodes back to the exact signed payload | ${E2E_OUTCOME} |"
            echo "| Chat messages transfer in both directions over a libp2p protocol stream | ${E2E_OUTCOME} |"
            echo "| A tampered signed offer is rejected as an invalid signature | ${E2E_OUTCOME} |"
            echo "| A peer refuses to dial itself with its own offer | ${E2E_OUTCOME} |"
            echo "| Two Helia nodes transfer a file over the QR-negotiated connection, bitswap only | ${HELIA_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    needs: e2e
    runs-on: ubuntu-latest
    outputs:
      ipfs_cid: ${{ steps.publish.outputs.ipfs_cid }}
      ipfs_cid_v0: ${{ steps.publish.outputs.ipfs_cid_v0 }}
      ipfs_cid_v1: ${{ steps.publish.outputs.ipfs_cid_v1 }}
      item_hash: ${{ steps.publish.outputs.item_hash }}
      store_status: ${{ steps.publish.outputs.store_status }}
      store_processed: ${{ steps.publish.outputs.store_processed }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The elements ship as a bundle rather than as source, so it has to exist
      # before anything that imports them is built. `dist` is not committed.
      - name: Build the elements bundle
        run: pnpm --filter @le-space/libp2p-webrtc-qr build

      - name: Build demo
        run: pnpm --filter @le-space/libp2p-webrtc-qr-demo build

      - name: Install isolated Aleph deploy tooling
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.6.22

      - name: Publish to Aleph IPFS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: publish
        env:
          ALEPH_VM_MODE: site-publish
          ALEPH_SITE_DIRECTORY: ${{ github.workspace }}/examples/demo/dist
          ALEPH_SITE_PIN: 'true'
          ALEPH_SITE_NAME: ${{ github.ref == 'refs/heads/main' && 'webrtc-qr' || 'webrtc-qr-preview' }}
          ALEPH_SITE_CHANNEL: ALEPH-CLOUDSOLUTIONS
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Aleph publish attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done

      - name: Summarize the published build
        if: steps.publish.outputs.ipfs_cid != ''
        env:
          CID: ${{ steps.publish.outputs.ipfs_cid }}
          REF: ${{ github.ref_name }}
        run: |
          {
            echo '## Published build'
            echo
            echo "**Branch:** ${REF}"
            echo
            echo "**IPFS CID:** ${CID}"
            echo
            echo "**Test it here:** https://ipfs.aleph.cloud/ipfs/${CID}/"
            echo
            echo "Alternative: https://${CID}.ipfs.dweb.link/"
            echo
            echo 'Not ipfs.public.aleph.sh - that host serves an incomplete certificate'
            echo 'chain for its own name, so it fails outside a browser. It is fine as the'
            echo 'CNAME target for a custom domain, where a different certificate is used.'
            echo
            echo 'Both gateways are HTTPS, so camera access and the share sheet work, and'
            echo 'invite links generated there point back to the same gateway path.'
          } >> "$GITHUB_STEP_SUMMARY"

  link-domain:
    needs: build-and-deploy
    # The domain follows main. A dispatch from a branch has to ask for it
    # explicitly, so a preview cannot silently replace what people are using.
    if: >-
      (github.ref == 'refs/heads/main' || inputs.link_domain) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-and-deploy.outputs.item_hash != '' &&
      needs.build-and-deploy.outputs.store_processed == 'true'
    runs-on: ubuntu-latest
    env:
      ALEPH_MAIN_SITE_DOMAIN: webrtc-qr.le-space.de
    steps:
      - uses: actions/checkout@v6

      - name: Install isolated Aleph deploy tooling
        run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.6.22

      - name: Link custom domain
        env:
          ALEPH_VM_MODE: site-domain-link
          ALEPH_SITE_ITEM_HASH: ${{ needs.build-and-deploy.outputs.item_hash }}
          ALEPH_SITE_IPFS_CID: ${{ needs.build-and-deploy.outputs.ipfs_cid }}
          ALEPH_SITE_IPFS_CID_V0: ${{ needs.build-and-deploy.outputs.ipfs_cid_v0 }}
          ALEPH_SITE_DOMAIN: ${{ inputs.domain || env.ALEPH_MAIN_SITE_DOMAIN }}
          ALEPH_SITE_DOMAIN_CATCH_ALL_PATH: /index.html
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"

      - name: Summarize deployment
        env:
          DOMAIN: ${{ inputs.domain || env.ALEPH_MAIN_SITE_DOMAIN }}
          CID: ${{ needs.build-and-deploy.outputs.ipfs_cid }}
        run: |
          {
            echo '## Deployment'
            echo
            echo "**Live demo:** https://${DOMAIN}"
            echo
            echo "**IPFS CID:** \`${CID}\`"
            echo
            echo 'Camera scanning needs a secure origin, so use the HTTPS domain rather than a gateway path.'
          } >> "$GITHUB_STEP_SUMMARY"
